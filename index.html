<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Retro Concept - HTML Standalone</title>
  <link rel="icon" href="./favicon.png" type="image/x-icon">
  <style>
    /* ==========================================================================
       1. 전역 리셋 & 기본 폰트
       ========================================================================== */
    /* 브라우저마다 다른 기본 여백/박스 계산 방식을 통일 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 40px 20px;
    }

    /* 페이지 전체를 감싸는 최대 900px 중앙 정렬 컨테이너 */
    .container {
      max-width: 900px;
      margin: 0 auto;
      position: relative; /* 로고(.logo-img)를 절대좌표로 겹쳐 올리기 위한 기준점 */
    }

    /* --------------------------------------------------------------------
       상단 중앙 로고 (클릭 시 홈으로 이동, navigateTo('home-page') 참고)
       -------------------------------------------------------------------- */
    .logo-img {
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%); /* 가로 중앙 정렬 */
      max-width: 120px;
      height: auto;
      object-fit: contain;
      z-index: 10; /* 다른 콘텐츠 위에 항상 보이도록 */
      cursor: pointer;
    }

    /* ==========================================================================
       2. SPA(싱글 페이지 앱) 방식의 화면 전환
       - 실제로 페이지 이동(새로고침)을 하지 않고, .page 요소들 중
         .active 클래스가 붙은 것만 보여주는 방식으로 동작한다.
       - 화면 전환 로직은 하단 스크립트의 navigateTo() 함수 참고.
       ========================================================================== */
    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* --------------------------------------------------------------------
       각 페이지 공통 레이아웃: 좌측 메뉴 + 우측(또는 중앙) 콘텐츠
       -------------------------------------------------------------------- */
    .main-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 420px; /* 페이지마다 콘텐츠 높이가 달라도 레이아웃이 크게 흔들리지 않도록 최소 높이 고정 */
      margin-bottom: 30px;
      padding-top: 60px; /* 상단 로고(.logo-img)와 겹치지 않도록 여백 확보 */
    }

    /* 좌측 세로 버튼 메뉴(About/Shop/News/Cart/Help) */
    .nav-buttons {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    /* 참고: 메뉴 안의 실제 <a> 버튼들은 더 이상 각 페이지에 직접 복사되어 있지 않고,
       하단 스크립트의 getNavHTML() 함수가 페이지 로드 시 자동으로 채워 넣는다.
       (동일한 메뉴가 5개 페이지에 각각 붙여넣기 되어 있으면, 메뉴 링크 하나 바꿀 때마다
        5곳을 전부 고쳐야 해서 실수하기 쉽다 → 한 곳(getNavHTML)만 고치면 되도록 개선함) */

    /* --------------------------------------------------------------------
       90년대 스타일 입체(타원형) 버튼 공통 스타일
       -------------------------------------------------------------------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 170px;
      height: 60px;
      border-radius: 50%; /* 완전한 타원/원형 버튼 */
      color: #ffffff;
      text-decoration: none;
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 22px;
      font-weight: normal;
      letter-spacing: 0.5px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      cursor: pointer;
      user-select: none;
    }

    /* 버튼별 색상(라디얼 그라디언트로 입체감 표현) + 안쪽 그림자로 볼록한 느낌 연출 */
    .btn-about {
      background: radial-gradient(circle at 35% 30%, #4da3eb, #00569e 60%, #002b54 100%);
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6), inset 0 -3px 6px rgba(0, 0, 0, 0.4);
    }

    .btn-shop {
      background: radial-gradient(circle at 35% 30%, #ff5252, #cc0000 60%, #660000 100%);
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6), inset 0 -3px 6px rgba(0, 0, 0, 0.4);
    }

    .btn-news {
      background: radial-gradient(circle at 35% 30%, #ffff80, #dada00 60%, #808000 100%);
      color: #333333; /* 배경이 밝은 노란색이라 글자색만 어둡게 예외 처리 */
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), inset 0 -3px 6px rgba(0, 0, 0, 0.3);
    }

    .btn-cart {
      background: radial-gradient(circle at 35% 30%, #5ce69a, #00ab55 60%, #004d26 100%);
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6), inset 0 -3px 6px rgba(0, 0, 0, 0.4);
    }

    .btn-help {
      background: radial-gradient(circle at 35% 30%, #b359e6, #7a1ba6 60%, #3d005c 100%);
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6), inset 0 -3px 6px rgba(0, 0, 0, 0.4);
    }

    /* 우측(또는 중앙) 큰 콘텐츠 영역 - 이미지/텍스트/쇼핑 위젯 등이 들어감 */
    .visual-area {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-img {
      width: 500px;
      height: auto;
      object-fit: contain;
      margin-right: 10px;
    }

    /* --------------------------------------------------------------------
       About Us 페이지 전용 텍스트
       -------------------------------------------------------------------- */
    .about-text {
      font-size: 42px;
      color: #333333;
      font-weight: 300;
      letter-spacing: -1px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      text-align: center;
    }

    /* --------------------------------------------------------------------
       Shop 페이지 영역
       -------------------------------------------------------------------- */
    .shop-area {
      /* display:flex 는 상위 .visual-area 에서 이미 지정되어 있으므로 여기서는
         정렬 방향만 세로로 바꿔준다 */
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .shop-product-img {
      width: 320px;
      height: auto;
      object-fit: contain;
    }

    /* --------------------------------------------------------------------
       쇼피파이(Shopify) Buy Button 위젯 영역
       ⚠️ 중요: Shopify Buy Button SDK는 실제 "구매하기" 버튼(.shopify-buy__btn)을
       상품 위젯 내부의 <iframe> 문서 안에 렌더링한다. 부모 페이지(이 HTML)의
       CSS 규칙은 iframe 내부 문서까지 침투하지 못하기 때문에,
       아래 #product-component-... .shopify-buy__btn { ... } 규칙은
       실제로는 적용되지 않는 "죽은 CSS"였다. (이번 수정의 핵심 버그)
       → 실제 버튼 디자인은 스크립트 안의 ShopifyBuyInit() 함수에서
         SDK의 options.product.styles.button 값으로 지정해야 반영된다.
       아래 CSS는 혹시 모를 구버전 SDK(iframe을 쓰지 않는 경우)를 대비한
       안전망(fallback)으로만 남겨둔다.
       -------------------------------------------------------------------- */
    #product-component-1785980733528 {
      display: block !important;
      min-height: 70px !important;
      text-align: center !important;
    }

    /* iframe 요소 자체는 부모 문서의 DOM 노드이므로 크기 지정은 정상 적용되지만,
       ⚠️ 버그 수정: 예전에는 width/height를 220px/75px로 강제 고정해뒀었다.
       쇼피파이 SDK는 이미지+제목+가격+버튼이 다 들어갈 수 있도록 콘텐츠 크기에 맞춰
       iframe 크기를 스스로(JS로) 조절해주는데, 위처럼 !important로 크기를 못박아버리면
       그 자동 조절을 덮어써서 내용이 작은 박스 안에 잘려 보이게 된다
       (상품 이미지가 반 잘리고 구매 버튼이 화면 밖으로 밀려 안 보이던 원인).
       → 폭에만 최대치를 주고, 높이는 SDK가 알아서 정하도록 강제하지 않는다. */
    #product-component-1785980733528 iframe {
      display: inline-block !important;
      max-width: 100% !important;
    }

    /* fallback: 위 설명대로 iframe 내부에는 적용되지 않을 가능성이 높음 */
    #product-component-1785980733528 .shopify-buy__btn {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 190px !important;
      height: 62px !important;
      border-radius: 50px !important;
      font-family: 'Impact', 'Arial Black', sans-serif !important;
      font-size: 22px !important;
      font-weight: normal !important;
      letter-spacing: 0.5px !important;
      color: #ffffff !important;
      background: radial-gradient(circle at 35% 30%, #ff5252, #cc0000 60%, #660000 100%) !important;
      box-shadow: inset 0 3px 6px rgba(255, 255, 255, 0.7), inset 0 -4px 8px rgba(0, 0, 0, 0.5), 0 6px 12px rgba(0, 0, 0, 0.2) !important;
      border: 1px solid rgba(0, 0, 0, 0.2) !important;
      cursor: pointer !important;
      opacity: 1 !important;
      visibility: visible !important;
      transition: transform 0.1s ease, filter 0.2s ease !important;
    }

    #product-component-1785980733528 .shopify-buy__btn:hover {
      background: radial-gradient(circle at 35% 30%, #ff7676, #e60000 60%, #800000 100%) !important;
      transform: scale(1.05) !important;
      filter: brightness(1.1) !important;
    }

    #product-component-1785980733528 .shopify-buy__btn:active {
      transform: scale(0.97) !important;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.6) !important;
    }

    /* --------------------------------------------------------------------
       News / Help 처럼 이미지 없이 제목 텍스트만 있는 서브 화면 공통 스타일
       -------------------------------------------------------------------- */
    .sub-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 420px;
      text-align: center;
    }

    .sub-title {
      font-size: 38px;
      color: #333333;
      font-weight: 300;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    /* ==========================================================================
       3. 구분선 & 하단 푸터(Footer)
       ========================================================================== */
    .divider {
      border: none;
      border-top: 1.5px solid #000000;
      margin-bottom: 15px;
    }

    .footer {
      font-family: 'Times New Roman', Times, serif;
      font-size: 13px;
      color: #000000;
      line-height: 1.5;
    }
    /* 참고: 실제 링크/저작권 문구는 더 이상 각 페이지에 복사되어 있지 않고,
       스크립트의 getFooterLinksHTML(), getFooterCopyrightHTML() 함수가
       페이지 로드 시 자동으로 채워 넣는다. 어떤 버전(상세/간단)을 넣을지는
       footer 태그의 data-footer 속성으로 구분한다. */

    .footer-links {
      margin-bottom: 12px;
    }

    .footer-links a {
      color: #0000ff;
      text-decoration: underline;
    }

    .footer-copyright {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
    }

    .nokia-logo {
      font-family: 'Arial Black', sans-serif;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: -1px;
    }

    .footer-modified {
      font-style: italic;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 상단 로고: 클릭하면 홈 화면으로 이동 -->
    <img src="logo.png" alt="Bubble Logo" class="logo-img" onclick="navigateTo('home-page')">

    <!-- ==================================================================
         [페이지 1] 홈 (기본으로 보이는 화면 - class="active")
         ================================================================== -->
    <div id="home-page" class="page active">
      <div class="main-content">
        <!-- 메뉴는 비어있는 상태로 두고, 스크립트가 getNavHTML()로 자동 채움 -->
        <nav class="nav-buttons"></nav>

        <div class="visual-area">
          <img src="fish.gif" alt="Main Content Image" class="main-img">
        </div>
      </div>

      <hr class="divider">

      <!-- data-footer="detailed": 법적고지/FAQ 문구 + 최종수정일까지 표시하는 상세 버전 -->
      <footer class="footer" data-footer="detailed"></footer>
    </div>

    <!-- ==================================================================
         [페이지 2] About Us
         ================================================================== -->
    <div id="about-page" class="page">
      <div class="main-content">
        <nav class="nav-buttons"></nav>

        <div class="visual-area">
          <p class="about-text">We were founded in 2026</p>
        </div>
      </div>

      <hr class="divider">
      <footer class="footer" data-footer="detailed"></footer>
    </div>

    <!-- ==================================================================
         [페이지 3] Shop (쇼피파이 Buy Button 위젯이 삽입되는 페이지)
         ================================================================== -->
    <div id="shop-page" class="page">
      <div class="main-content">
        <nav class="nav-buttons"></nav>

        <div class="visual-area shop-area">
          <!-- 쇼피파이 SDK가 이 div 안에 상품/구매 위젯을 그려 넣는다.
               최초 진입 시점에만 초기화되도록 navigateTo() 안에서 제어함 -->
          <div id="product-component-1785980733528"></div>
        </div>
      </div>

      <hr class="divider">
      <footer class="footer" data-footer="detailed"></footer>
    </div>

    <!-- ==================================================================
         [페이지 4] Cart (외부 쇼피파이 사이트로 이동하지 않고, 우리 사이트 안에서
         쇼피파이 장바구니 위젯을 보여주는 전용 화면)
         ================================================================== -->
    <div id="cart-page" class="page">
      <div class="main-content">
        <nav class="nav-buttons"></nav>
        <div class="visual-area sub-screen">
          <h1 class="sub-title">Your Cart</h1>
          <!-- 쇼피파이 장바구니 위젯(수량/합계/결제 버튼 등)이 여기 렌더링된다.
               장바구니가 아직 준비되지 않았을 때는 안내 문구만 잠깐 보여준다. -->
          <div id="cart-container" style="margin-top: 20px; min-height: 60px;">
            <p style="color:#666; font-size:15px;">장바구니를 불러오는 중입니다...</p>
          </div>
        </div>
      </div>
      <hr class="divider">
      <footer class="footer"></footer>
    </div>

    <!-- ==================================================================
         [페이지 5] News
         ================================================================== -->
    <div id="news-page" class="page">
      <div class="main-content">
        <nav class="nav-buttons"></nav>
        <div class="visual-area sub-screen">
          <h1 class="sub-title">Latest News</h1>
        </div>
      </div>
      <hr class="divider">
      <!-- data-footer 속성이 없으면(=detailed가 아니면) 간단 버전 푸터가 채워짐 -->
      <footer class="footer"></footer>
    </div>

    <!-- ==================================================================
         [페이지 6] Help
         ================================================================== -->
    <div id="help-page" class="page">
      <div class="main-content">
        <nav class="nav-buttons"></nav>
        <div class="visual-area sub-screen">
          <h1 class="sub-title">Customer Support</h1>
        </div>
      </div>
      <hr class="divider">
      <footer class="footer"></footer>
    </div>

  </div>

  <script>
    /* ========================================================================
       공통 레이아웃(메뉴 / 푸터) 생성 함수
       - 기존 파일은 동일한 메뉴·푸터 HTML이 5개 페이지에 전부 복사되어 있어서,
         메뉴 링크 하나만 바꾸려 해도 5곳을 일일이 찾아 고쳐야 했다.
       - 아래처럼 "생성 함수"로 한 곳에 모아두면, 이후에는 이 함수만 수정하면
         모든 페이지에 자동으로 반영되어 유지보수가 훨씬 쉬워진다.
       ======================================================================== */

    /**
     * 좌측 세로 메뉴(About/Shop/News/Cart/Help) HTML을 반환한다.
     * Cart도 다른 메뉴와 동일하게 navigateTo('cart-page')로 사이트 내부 화면을 보여준다.
     * (예전에는 외부 쇼피파이 사이트로 이동하는 경우가 있었으나, 이번 수정으로
     *  항상 이 사이트 안에서만 화면이 전환되도록 통일했다)
     */
    function getNavHTML() {
      return [
        '<a href="#" class="btn btn-about" onclick="navigateTo(\'about-page\'); return false;">About Us</a>',
        '<a href="#" class="btn btn-shop" onclick="navigateTo(\'shop-page\'); return false;">Shop</a>',
        '<a href="#" class="btn btn-news" onclick="navigateTo(\'news-page\'); return false;">News</a>',
        '<a href="#" class="btn btn-cart" onclick="navigateTo(\'cart-page\'); return false;">Cart</a>',
        '<a href="#" class="btn btn-help" onclick="navigateTo(\'help-page\'); return false;">Help</a>'
      ].join('');
    }

    /** 모든 페이지 하단에 공통으로 들어가는 링크 목록 HTML */
    function getFooterLinksHTML() {
      return '<div class="footer-links">[' +
        '<a href="#" onclick="navigateTo(\'about-page\'); return false;">Aboutus</a> | ' +
        '<a href="#" onclick="navigateTo(\'shop-page\'); return false;">Shop</a> | ' +
        '<a href="#" onclick="navigateTo(\'news-page\'); return false;">News</a> | ' +
        '<a href="#" onclick="navigateTo(\'cart-page\'); return false;">Cart</a> | ' +
        '<a href="#" onclick="navigateTo(\'help-page\'); return false;">Help</a>]' +
        '</div>';
    }

    /**
     * 저작권 표시 영역 HTML을 반환한다.
     * @param {boolean} detailed - true면 법적고지/FAQ 문구 + 최종수정일까지 표시(Home/About/Shop),
     *                              false면 저작권 한 줄만 표시(News/Help). 원본 파일의 기존 동작을 그대로 유지.
     */
    function getFooterCopyrightHTML(detailed) {
      if (detailed) {
        return '' +
          '<div class="footer-copyright">' +
            '<div>' +
              'Copyright © Bubble 2026. All rights reserved.<br>' +
              'Please ensure that you read our <a href="#">legal notice</a> before accessing any of our pages.<br>' +
              '<a href="#">FAQ</a>, <a href="#">comments and feedback</a> on www.bubble.com' +
            '</div>' +
            '<div class="nokia-logo">BUBBLE</div>' +
          '</div>' +
          '<div class="footer-modified">This page was last modified: Monday, 16-Dec-96 16:57:27</div>';
      }
      return '' +
        '<div class="footer-copyright">' +
          '<div>Copyright © Bubble 2026. All rights reserved.</div>' +
          '<div class="nokia-logo">BUBBLE</div>' +
        '</div>';
    }

    /**
     * 페이지가 처음 로드될 때 모든 .nav-buttons / .footer 요소를 찾아
     * 위 함수들이 만들어주는 HTML로 채워 넣는다.
     */
    function initSharedLayout() {
      document.querySelectorAll('.nav-buttons').forEach(function (nav) {
        nav.innerHTML = getNavHTML();
      });
      document.querySelectorAll('.footer').forEach(function (footer) {
        var detailed = footer.dataset.footer === 'detailed';
        footer.innerHTML = getFooterLinksHTML() + getFooterCopyrightHTML(detailed);
      });
    }

    /* ========================================================================
       화면 전환(라우팅) 로직
       ======================================================================== */

    // 쇼피파이 상품 위젯 / 장바구니 위젯을 각각 이미 초기화했는지 여부(중복 초기화 방지용 플래그)
    let shopifyInitialized = false;
    let cartWidgetInitialized = false;

    /**
     * 지정한 pageId를 가진 .page 요소만 보이도록 전환한다.
     * Cart 버튼도 이 함수를 통해 'cart-page'로 이동하므로, 팝업이나 외부 사이트로
     * 빠지는 일 없이 항상 이 사이트 안에서만 화면이 전환된다.
     * @param {string} pageId - 이동할 페이지의 id (예: 'shop-page', 'cart-page')
     */
    function navigateTo(pageId) {
      // 1) 모든 페이지에서 active 클래스 제거
      var pages = document.querySelectorAll('.page');
      pages.forEach(function (page) {
        page.classList.remove('active');
      });

      // 2) 이동할 페이지에만 active 클래스 추가
      var targetPage = document.getElementById(pageId);
      if (targetPage) {
        targetPage.classList.add('active');
      }

      // 3) 페이지 전환 시 스크롤을 맨 위로 초기화
      window.scrollTo(0, 0);

      // 4) Shop 페이지에 처음 진입할 때만 쇼피파이 상품(구매) 위젯을 생성한다.
      //    (매번 새로 만들면 중복 렌더링/성능 낭비가 발생하므로 최초 1회만 실행)
      if (pageId === 'shop-page' && !shopifyInitialized) {
        shopifyInitialized = true;
        initShopifyButton();
      }

      // 5) Cart 페이지에 처음 진입할 때만 쇼피파이 장바구니 위젯을 생성한다.
      //    Shop 페이지와 같은 클라이언트(client)를 공유하므로, 이전에 담은 상품이
      //    그대로 이 장바구니 화면에 나타난다.
      if (pageId === 'cart-page' && !cartWidgetInitialized) {
        cartWidgetInitialized = true;
        initShopifyCartWidget();
      }
    }

    /* ------------------------------------------------------------------
       쇼피파이 SDK 공용 로더
       - Shop 페이지(상품 위젯)와 Cart 페이지(장바구니 위젯)가 각자 따로 스크립트를
         불러오면, 사용자가 두 페이지를 모두 방문했을 때 스크립트가 중복으로
         로드되거나 client가 여러 번 생성될 수 있다.
       - shopifyUIPromise에 "한 번 준비되면 재사용되는" 프라미스를 캐싱해두고,
         두 위젯 모두 getShopifyUI()만 호출하면 되도록 통일했다.
       ------------------------------------------------------------------ */
    let shopifyUIPromise = null;

    /**
     * 쇼피파이 Buy Button SDK 스크립트를 (필요하다면) 불러오고,
     * client를 만들어 준비된 UI 객체를 반환하는 프라미스를 돌려준다.
     * 이미 한 번 호출되었다면 새로 로드하지 않고 같은 프라미스를 재사용한다.
     * @returns {Promise<Object>} ShopifyBuy.UI.onReady(client)의 결과(ui 객체)
     */
    function getShopifyUI() {
      if (shopifyUIPromise) {
        return shopifyUIPromise;
      }

      shopifyUIPromise = new Promise(function (resolve, reject) {
        var scriptURL = 'https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js';

        function ready() {
          var client = ShopifyBuy.buildClient({
            domain: 'jtrdpd-xi.myshopify.com',
            storefrontAccessToken: '4461296fde8f3c1267f0ad8072b55790'
          });
          ShopifyBuy.UI.onReady(client).then(resolve).catch(reject);
        }

        // 이미 SDK가 로드되어 있다면 스크립트를 다시 불러오지 않고 바로 준비
        if (window.ShopifyBuy && window.ShopifyBuy.UI) {
          ready();
        } else {
          var script = document.createElement('script');
          script.async = true;
          script.src = scriptURL;
          script.onload = ready;
          script.onerror = reject; // 스크립트 로드 실패(네트워크 오류 등) 처리
          document.head.appendChild(script);
        }
      });

      return shopifyUIPromise;
    }

    /**
     * 상품 위젯(#product-component-...)을 생성한다.
     * Shop 페이지에 처음 진입했을 때 navigateTo()에서 한 번만 호출된다.
     */
    function initShopifyButton() {
      getShopifyUI().then(function (ui) {
        ui.createComponent('product', {
            id: '9508935500015',
            node: document.getElementById('product-component-1785980733528'),
            moneyFormat: '%24%7B%7Bamount%7D%7D', // "${{amount}}" 를 URL 인코딩한 값(쇼피파이 기본 통화 포맷)
            options: {
              product: {
                contents: {
                  img: true,
                  imgWithCarousel: false,
                  title: true,
                  price: true,
                  button: true
                },
                styles: {
                  product: {
                    '@media (min-width: 601px)': {
                      'max-width': 'calc(25% - 20px)',
                      'margin-left': '20px',
                      'margin-bottom': '50px'
                    }
                  },
                  /* ---------------------------------------------------------
                     🔧 버그 수정: "구매하기" 버튼은 iframe 내부에서 렌더링되므로
                     바깥쪽 <style>의 .shopify-buy__btn CSS는 적용되지 않는다.
                     따라서 사이트의 3D 버블 버튼 디자인(빨간 그라디언트 + 입체 그림자)을
                     여기, SDK가 실제로 읽는 styles.button 값으로 직접 지정해야
                     Shop 페이지의 구매 버튼에도 다른 메뉴 버튼과 통일된 디자인이 적용된다.
                     --------------------------------------------------------- */
                  button: {
                    ':hover': {
                      background: 'radial-gradient(circle at 35% 30%, #ff7676, #e60000 60%, #800000 100%)'
                    },
                    ':focus': {
                      background: 'radial-gradient(circle at 35% 30%, #ff7676, #e60000 60%, #800000 100%)'
                    },
                    background: 'radial-gradient(circle at 35% 30%, #ff5252, #cc0000 60%, #660000 100%)',
                    color: '#ffffff',
                    'border-radius': '50px',
                    border: '1px solid rgba(0, 0, 0, 0.2)',
                    'box-shadow': 'inset 0 3px 6px rgba(255, 255, 255, 0.7), inset 0 -4px 8px rgba(0, 0, 0, 0.5), 0 6px 12px rgba(0, 0, 0, 0.2)',
                    'font-family': "'Impact', 'Arial Black', sans-serif",
                    'font-size': '22px',
                    'font-weight': 'normal',
                    'letter-spacing': '0.5px',
                    'padding-left': '37px',
                    'padding-right': '37px'
                  }
                },
                text: {
                  button: 'Buy now'
                }
              },
              productSet: {
                styles: {
                  products: {
                    '@media (min-width: 601px)': {
                      'margin-left': '-20px'
                    }
                  }
                }
              },
              modalProduct: {
                contents: {
                  img: false,
                  imgWithCarousel: true,
                  button: false,
                  buttonWithQuantity: true
                },
                styles: {
                  product: {
                    '@media (min-width: 601px)': {
                      'max-width': '100%',
                      'margin-left': '0px',
                      'margin-bottom': '0px'
                    }
                  },
                  // 모달(확대보기) 안의 구매 버튼도 동일한 디자인으로 통일
                  button: {
                    ':hover': {
                      background: 'radial-gradient(circle at 35% 30%, #ff7676, #e60000 60%, #800000 100%)'
                    },
                    ':focus': {
                      background: 'radial-gradient(circle at 35% 30%, #ff7676, #e60000 60%, #800000 100%)'
                    },
                    background: 'radial-gradient(circle at 35% 30%, #ff5252, #cc0000 60%, #660000 100%)',
                    color: '#ffffff',
                    'border-radius': '50px',
                    border: '1px solid rgba(0, 0, 0, 0.2)',
                    'box-shadow': 'inset 0 3px 6px rgba(255, 255, 255, 0.7), inset 0 -4px 8px rgba(0, 0, 0, 0.5), 0 6px 12px rgba(0, 0, 0, 0.2)',
                    'font-family': "'Impact', 'Arial Black', sans-serif",
                    'font-size': '22px',
                    'font-weight': 'normal',
                    'letter-spacing': '0.5px',
                    'padding-left': '37px',
                    'padding-right': '37px'
                  }
                },
                text: {
                  button: 'Buy now'
                }
              },
              option: {}
              // 🔧 참고: 예전에는 여기 cart/toggle 설정이 있어서, 상품 위젯이
              // 자기 혼자 화면 위에 떠다니는 "장바구니 말풍선(toggle)"과 팝업 장바구니를
              // 자동으로 만들어냈다. 이제는 Cart 메뉴가 전용 cart-page로 이동해서
              // 아래 initShopifyCartWidget()이 만든 장바구니 화면을 보여주므로,
              // 상품 위젯에서는 더 이상 그 자동 팝업이 필요 없어 제거했다.
            }
          }).then(function (component) {
            // 상품 위젯 컴포넌트 참조를 저장해 둔다(추후 디버깅/확장용).
            window.shopifyProductComponent = component;
          });
      });
    }

    /**
     * Cart 페이지의 #cart-container 안에 쇼피파이 장바구니(담긴 상품, 합계, 결제 버튼)를
     * 항상 펼쳐진 형태(popup:false)로 그려 넣는다. Shop 페이지의 상품 위젯과 동일한
     * 쇼피파이 client를 사용하므로, 같은 브라우저에서 담았던 상품이 그대로 나타난다.
     * Cart 페이지에 처음 진입했을 때 navigateTo()에서 한 번만 호출된다.
     */
    function initShopifyCartWidget() {
      var container = document.getElementById('cart-container');

      getShopifyUI().then(function (ui) {
        container.innerHTML = ''; // "불러오는 중입니다..." 안내 문구 제거

        ui.createComponent('cart', {
          node: container,
          moneyFormat: '%24%7B%7Bamount%7D%7D',
          options: {
            cart: {
              styles: {
                button: {
                  ':hover': {
                    background: 'radial-gradient(circle at 35% 30%, #ff7676, #e60000 60%, #800000 100%)'
                  },
                  ':focus': {
                    background: 'radial-gradient(circle at 35% 30%, #ff7676, #e60000 60%, #800000 100%)'
                  },
                  background: 'radial-gradient(circle at 35% 30%, #ff5252, #cc0000 60%, #660000 100%)',
                  color: '#ffffff',
                  'border-radius': '50px',
                  border: '1px solid rgba(0, 0, 0, 0.2)',
                  'box-shadow': 'inset 0 3px 6px rgba(255, 255, 255, 0.7), inset 0 -4px 8px rgba(0, 0, 0, 0.5), 0 6px 12px rgba(0, 0, 0, 0.2)',
                  'font-family': "'Impact', 'Arial Black', sans-serif",
                  'font-size': '20px',
                  'font-weight': 'normal',
                  'letter-spacing': '0.5px'
                }
              },
              text: {
                total: 'Subtotal',
                empty: '장바구니가 비어 있습니다.',
                notice: '',
                button: 'Checkout' // 결제(Checkout) 버튼을 누르면 실제 결제를 위해 쇼피파이 결제 페이지로 이동한다.
                                    // 이건 정상적인 온라인 쇼핑몰 동작이며(실제 카드 결제는 반드시 안전한 결제
                                    // 서버에서 이뤄져야 함), Cart 화면 자체가 외부로 이동하는 것과는 다르다.
              },
              popup: false // 팝업이 아니라 cart-page 화면 안에 항상 펼쳐진 형태로 표시
            }
          }
        }).then(function (component) {
          window.shopifyCartComponent = component;
        }).catch(function () {
          container.innerHTML = '<p style="color:#999; font-size:15px;">장바구니를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</p>';
        });
      }).catch(function () {
        // 스크립트 로드 실패(네트워크 오류 등) 시 안내 문구로 대체
        container.innerHTML = '<p style="color:#999; font-size:15px;">장바구니를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</p>';
      });
    }

    // ------------------------------------------------------------------
    // 최초 로드 시 nav/footer를 채워 넣는다.
    // (DOMContentLoaded 시점엔 이미 스크립트가 body 끝에 있어 DOM이 준비되어 있지만,
    //  안전하게 이벤트로 감싸서 실행 순서를 보장한다)
    // ------------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', initSharedLayout);
  </script>

</body>
</html>
